# nginx на хосте: HTTPS и проксирование на контейнер web (127.0.0.1:8080).
#
# Установка (DOMAIN — ваш домен):
#   sudo sed "s/DOMAIN/example.ru/g" deploy/nginx/detailing.conf \
#     > /etc/nginx/sites-available/detailing.conf
#   sudo ln -s /etc/nginx/sites-available/detailing.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN -d www.DOMAIN --redirect -m you@mail --agree-tos
#
# certbot сам допишет сюда блок 443 с сертификатом и редирект с http на https,
# а потом будет продлевать сертификат автоматически.

# www → основной домен: один адрес сайта, cookie не делятся между двумя.
server {
    listen 80;
    listen [::]:80;
    server_name www.DOMAIN;
    return 301 https://DOMAIN$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    server_tokens off;

    # До трёх фото по 15 МБ в одной заявке + поля формы. Должно совпадать
    # с лимитом во frontend/nginx (внутренний nginx).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка крупных фото по медленной мобильной сети.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Фото не буферизуем на диск хоста дважды: внутренний nginx и так буферизует.
        proxy_request_buffering off;
    }
}
