name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Новый push в ту же ветку отменяет ещё идущую проверку старого коммита.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.5.1"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Check poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Ruff lint
        run: poetry run ruff check --output-format=github .

      - name: Ruff format
        run: poetry run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379/15
      # Для alembic: приложение читает настройки при импорте.
      APP_CONFIG__DB__URL: postgresql+asyncpg://test:test@localhost:5432/test
      APP_CONFIG__GOOGLE__CLIENT_ID: ci
      APP_CONFIG__GOOGLE__CLIENT_SECRET: ci
      APP_CONFIG__AUTH__SECRET_KEY: ci-secret-key-not-for-production-use
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # Миграции на чистой базе: применяются, откатываются и совпадают с моделями.
      - name: Migrations upgrade
        run: poetry run alembic upgrade head

      - name: Migrations match models
        run: poetry run alembic check

      - name: Migrations downgrade to base and back
        run: |
          poetry run alembic downgrade base
          poetry run alembic upgrade head

      - name: Pytest
        run: poetry run pytest -ra --durations=10

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Только сборка, без публикации: проверяем, что Dockerfile не сломан.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: detailing-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: detailing-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci ставит строго по package-lock.json и падает, если он устарел.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_CONFIG__DB__URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      APP_CONFIG__GOOGLE__CLIENT_ID: ci
      APP_CONFIG__GOOGLE__CLIENT_SECRET: ci
      APP_CONFIG__AUTH__SECRET_KEY: ci-secret-key-not-for-production-use
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root
          npm ci --prefix frontend

      # Схема и TS-типы в репозитории должны совпадать с текущим API.
      # Упало — выполните локально две команды ниже и закоммитьте результат.
      - name: Regenerate OpenAPI schema and types
        run: |
          poetry run python -m scripts.export_openapi
          npm run gen:api --prefix frontend

      - name: Check for drift
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts