[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13.1"
fastapi = "^0.152.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.1.5"}
asyncpg = "^0.32.0"
alembic = "^1.20.0"
pydantic-settings = "^2.16.1"
google-genai = "^2.32.0"
tenacity = ">=8.2.3,<9.2.0"
authlib = "^1.9.1"
httpx = "^0.28.1"
itsdangerous = "^2.2.0"
pyjwt = "^2.15.1"
pillow = "^13.0.0"
python-multipart = "^0.0.32"
arq = "^0.28.0"
aiobotocore = "^3.10.0"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "moto[s3] (>=5.2.4,<6.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "flask-cors (>=6.0.5,<7.0.0)"
]
