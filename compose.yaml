name: detailing

# Общие настройки для образа приложения: из него запускаются migrate, api и worker.
# Собирает образ только migrate (секция build ниже). Если дать build всем трём,
# Docker соберёт один и тот же образ трижды параллельно, и сборки подерутся за имя.
x-app: &app
  image: detailing-backend:local
  # Образ локальный, в Docker Hub его нет: никогда не пытаться его скачать.
  pull_policy: never
  init: true
  env_file: .env
  environment:
    # Адреса сервисов внутри сети compose. Перекрывают значения из .env,
    # где для локального запуска без Docker стоит localhost.
    APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER:-detailing}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-detailing}
    APP_CONFIG__REDIS__URL: redis://redis:6379/0
    APP_CONFIG__QUEUE__BACKEND: arq
    APP_CONFIG__STORAGE__BACKEND: local
    APP_CONFIG__STORAGE__LOCAL_PATH: /app/storage
  volumes:
    # Общая папка с фото: API сохраняет входные файлы, воркер читает их и пишет
    # результат. Нужна, пока файлы не переехали в S3.
    - storage:/app/storage

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-detailing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-detailing}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: очередь переживает перезапуск Redis, задачи не теряются.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Применяет миграции и завершается. api и worker стартуют только после успеха,
  # поэтому код никогда не работает со старой схемой базы.
  migrate:
    <<: *app
    build: .
    # Пересобирать при каждом `up` (из кеша это секунды): в контейнерах всегда свежий код.
    pull_policy: build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    volumes: []
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    ports:
      # Только localhost: снаружи API будет доступен через Nginx на этапе деплоя.
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    # Сколько ждать при остановке, прежде чем убить: воркер доделывает текущие
    # генерации (до QUEUE__JOB_TIMEOUT_SECONDS = 8 мин) и только потом выходит.
    stop_grace_period: 9m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  storage:
